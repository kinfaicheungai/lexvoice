<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LexVoice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=Figtree:wght@300;400;500;600&display=swap');

:root {
  --bg: #0d0f14;
  --surface: #151820;
  --surface2: #1c2030;
  --border: #252a3a;
  --accent: #4a9eff;
  --accent-dim: rgba(74,158,255,0.12);
  --danger: #ff4a4a;
  --danger-dim: rgba(255,74,74,0.15);
  --success: #4aff9e;
  --gold: #ffcc44;
  --gold-dim: rgba(255,204,68,0.12);
  --text: #e8eaf2;
  --muted: #6b7280;
  --dim: #9ca3af;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-size: 1.05rem;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Figtree', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  width: 100%;
}

/* ════ SETUP ════ */
#setup {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 1.5rem;
  overflow-y: auto;
}
.setup-inner { width: 100%; max-width: 460px; padding-bottom: 2rem; }

.brand { text-align: center; padding: 2rem 0 1.8rem; }
.brand-name {
  font-family: 'Crimson Pro', serif;
  font-size: 3rem; font-weight: 300;
  letter-spacing: 0.04em; line-height: 1;
}
.brand-name span { color: var(--accent); }
.brand-sub {
  font-size: 0.7rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--muted); margin-top: 0.5rem;
}

.setup-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.6rem;
  display: flex; flex-direction: column; gap: 1.2rem;
}

.field label {
  display: block; font-size: 0.68rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 0.45rem;
}
.field-row { display: flex; gap: 0.5rem; }
.field input {
  flex: 1; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: 'DM Mono', monospace;
  font-size: 0.82rem; padding: 0.65rem 0.85rem;
  outline: none; transition: border-color 0.15s;
}
.field input:focus { border-color: var(--accent); }
.eye-btn {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted);
  cursor: pointer; font-size: 1rem; padding: 0 0.7rem;
}
.hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.5; }
.hint a { color: var(--accent); text-decoration: none; }
.hint.optional { color: var(--gold); opacity: 0.8; }
.saved-notice {
  display: none; font-size: 0.68rem;
  color: var(--success); margin-top: 0.3rem;
}
.divider { border: none; border-top: 1px solid var(--border); }
.section-label {
  font-size: 0.62rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 0.85rem;
}
.toggle-row {
  display: flex; align-items: center;
  justify-content: space-between; gap: 1rem;
}
.toggle-label { font-size: 0.88rem; }
.toggle { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; cursor: pointer;
  background: var(--surface2); border-radius: 24px;
  border: 1px solid var(--border); transition: 0.2s;
}
.toggle-slider:before {
  content: ''; position: absolute;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--muted); top: 3px; left: 3px; transition: 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent); }
.toggle input:checked + .toggle-slider:before { background: var(--accent); transform: translateX(18px); }

/* Font size slider */
.slider-row { display: flex; align-items: center; gap: 0.75rem; }
.slider-row input[type=range] {
  flex: 1; accent-color: var(--accent);
  height: 4px; cursor: pointer;
}
.slider-val {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem; color: var(--accent);
  min-width: 2.5rem; text-align: right;
}

.btn-start {
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-family: 'Figtree', sans-serif;
  font-size: 1rem; font-weight: 600;
  padding: 0.9rem; cursor: pointer;
  letter-spacing: 0.04em; transition: opacity 0.15s;
}
.btn-start:hover { opacity: 0.88; }

/* ════ APP ════ */
#app { display: none; flex-direction: column; height: 100dvh; }
#app.active { display: flex; }

.app-header {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0.7rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-brand {
  font-family: 'Crimson Pro', serif;
  font-size: 1.35rem; font-weight: 300;
  letter-spacing: 0.04em;
}
.header-brand span { color: var(--accent); }
.header-controls { display: flex; align-items: center; gap: 0.4rem; }
.hdr-btn {
  background: none; border: 1px solid transparent;
  border-radius: 8px; color: var(--muted);
  cursor: pointer; font-size: 1.1rem;
  padding: 0.3rem 0.4rem; transition: all 0.15s;
}
.hdr-btn.on { color: var(--accent); border-color: var(--accent-dim); }
.hdr-btn:hover { border-color: var(--border); }

/* ════ CONTINUOUS FEED ════ */
.feed {
  flex: 1; overflow-y: auto;
  padding: 1.2rem 1.2rem 0.8rem;
  overscroll-behavior: contain;
}
.feed::-webkit-scrollbar { width: 3px; }
.feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); text-align: center;
  padding: 4rem 2rem; gap: 1rem;
  min-height: 60vh;
}
.empty-icon { font-size: 2.5rem; opacity: 0.35; }
.empty-text { font-size: 0.88rem; line-height: 1.7; max-width: 260px; }

.lang-divider {
  display: flex; align-items: center; gap: 0.6rem;
  margin: 1.1rem 0 0.7rem; opacity: 0.6;
}
.lang-divider-line { flex: 1; height: 1px; background: var(--border); }
.lang-divider-label {
  font-size: 0.6rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap;
}

/* Interim (streaming) text */
.entry-interim {
  font-size: var(--font-size);
  color: var(--muted);
  font-style: italic;
  line-height: 1.7;
  margin-bottom: 0.5rem;
  opacity: 0.7;
  min-height: 1.5em;
}

.entry {
  margin-bottom: 1rem;
  animation: entryIn 0.2s ease;
}
@keyframes entryIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.entry-orig {
  font-size: calc(var(--font-size) * 0.82);
  color: var(--muted); font-style: italic;
  line-height: 1.55; margin-bottom: 0.25rem;
}
.entry-trans {
  font-size: var(--font-size);
  line-height: 1.75; color: var(--text);
}

/* Term highlight */
.term-hl {
  background: rgba(255,204,68,0.18); color: var(--gold);
  border-radius: 3px; padding: 0 2px; cursor: pointer;
  border-bottom: 1px solid rgba(255,204,68,0.4);
  transition: background 0.15s;
}
.term-hl:hover { background: rgba(255,204,68,0.32); }

/* Processing */
.proc-entry {
  display: flex; align-items: center; gap: 0.5rem;
  margin-bottom: 0.5rem; opacity: 0.55;
}
.spinner {
  width: 13px; height: 13px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.proc-text { font-size: 0.78rem; color: var(--muted); }

/* ════ LIVE BAR ════ */
.live-bar {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.5rem 1rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0; min-height: 38px;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: background 0.2s;
}
.live-dot.rec { background: var(--danger); animation: pulse 1.2s infinite; }
.live-dot.proc { background: var(--accent); animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
.live-text { font-size: 0.78rem; color: var(--muted); flex: 1; }

/* ════ CONTROLS ════ */
.controls {
  display: flex; align-items: center; justify-content: space-around;
  padding: 0.7rem 1rem calc(0.7rem + var(--safe-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0; gap: 0.5rem;
}

.ctrl-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); display: flex; flex-direction: column;
  align-items: center; gap: 0.3rem;
  padding: 0.4rem 0.6rem; border-radius: 10px;
  transition: color 0.15s; min-width: 52px;
}
.ctrl-btn:hover { color: var(--text); }
.ctrl-icon { font-size: 1.3rem; line-height: 1; }
.ctrl-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }

.rec-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
.rec-btn {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.rec-btn.live { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
.rec-label-text { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

/* Cantonese press-hold button */
.yue-btn {
  background: var(--gold-dim);
  border: 2px solid rgba(255,204,68,0.3);
  border-radius: 10px; color: var(--gold);
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 0.3rem;
  padding: 0.5rem 0.7rem;
  transition: all 0.15s; min-width: 52px;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
.yue-btn.pressing {
  background: rgba(255,204,68,0.28);
  border-color: var(--gold);
  transform: scale(0.95);
}
.yue-btn.hidden { display: none; }
.yue-icon { font-size: 1.3rem; line-height: 1; }
.yue-label { font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; }

/* ════ TOOLTIP ════ */
.tooltip {
  position: fixed; bottom: 100px; left: 1rem; right: 1rem;
  background: var(--surface2); border: 1px solid var(--gold);
  border-radius: var(--radius); padding: 1rem 1.1rem;
  z-index: 100; opacity: 0; pointer-events: none;
  transform: translateY(6px); transition: all 0.2s;
  box-shadow: var(--shadow);
}
.tooltip.show { opacity: 1; pointer-events: all; transform: translateY(0); }
.tooltip-close {
  position: absolute; top: 0.6rem; right: 0.7rem;
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 0.9rem;
}
.tooltip-term { font-size: 0.95rem; font-weight: 600; color: var(--gold); margin-bottom: 0.4rem; }
.tooltip-def { font-size: 0.85rem; color: var(--dim); line-height: 1.6; }

/* ════ TOAST ════ */
.toast {
  position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 0.55rem 1.1rem;
  font-size: 0.82rem; color: var(--dim);
  opacity: 0; pointer-events: none; transition: all 0.25s;
  white-space: nowrap; z-index: 300;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok  { border-color: var(--success); color: var(--success); }
.toast.err { border-color: var(--danger);  color: #ff8888; }

.lang-sel-btn {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted);
  font-family: 'Figtree', sans-serif; font-size: 0.72rem;
  padding: 0.25rem 0.6rem; cursor: pointer; transition: all 0.15s;
}
.lang-sel-btn.active {
  background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
}
</style>
</head>
<body>

<!-- ══ SETUP ══ -->
<div id="setup">
<div class="setup-inner">
  <div class="brand">
    <div class="brand-name">Lex<span>Voice</span></div>
    <div class="brand-sub">Real-time Legal Interpreter</div>
    <div style="font-size:0.6rem;color:var(--border);margin-top:0.4rem;letter-spacing:0.1em">v5.0</div>
  </div>

  <div class="setup-card">

    <div class="field">
      <label>Anthropic API Key <span style="color:var(--muted);font-size:0.65rem;text-transform:none;letter-spacing:0">(Claude 翻譯 — 必填)</span></label>
      <div class="field-row">
        <input type="password" id="ant-key" placeholder="sk-ant-..." autocomplete="off" />
        <button class="eye-btn" onclick="toggleEye('ant-key',this)">👁</button>
      </div>
      <div class="hint">console.anthropic.com → API Keys</div>
      <div class="saved-notice" id="ant-saved">✓ 已記住</div>
    </div>

    <div class="field">
      <label>OpenAI API Key <span style="color:var(--muted);font-size:0.65rem;text-transform:none;letter-spacing:0">(粵語識別 — 可選)</span></label>
      <div class="field-row">
        <input type="password" id="oai-key" placeholder="sk-..." autocomplete="off" />
        <button class="eye-btn" onclick="toggleEye('oai-key',this)">👁</button>
      </div>
      <div class="hint optional">⚠ 填入後才有粵語按鈕。platform.openai.com → API Keys</div>
      <div class="saved-notice" id="oai-saved">✓ 已記住</div>
    </div>

    <hr class="divider">

    <div>
      <div class="section-label">顯示設定</div>

      <div class="toggle-row" style="margin-bottom:0.9rem">
        <span class="toggle-label">🔤 翻譯文字大小</span>
        <div class="slider-row" style="flex:1;margin-left:1rem">
          <input type="range" id="font-slider" min="14" max="36" value="17" oninput="updateFontSize(this.value)">
          <span class="slider-val" id="font-val">17</span>
        </div>
      </div>

      <div class="toggle-row" style="margin-bottom:0.75rem">
        <span class="toggle-label">⚖️ 法律術語解釋（昆士蘭）</span>
        <label class="toggle">
          <input type="checkbox" id="terms-on" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">💾 記住 Key（本機儲存）</span>
        <label class="toggle">
          <input type="checkbox" id="save-keys" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <button class="btn-start" onclick="startApp()">開始翻譯 →</button>
  </div>
</div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="app-header">
    <div class="header-brand">Lex<span>Voice</span> <span style="font-size:0.58rem;color:var(--muted);font-family:'DM Mono',monospace;font-weight:400">v5.0</span></div>
    <div class="header-controls">
      <button class="hdr-btn on" id="terms-btn" onclick="toggleTerms()" title="術語解釋">⚖️</button>
      <button class="hdr-btn" onclick="goSettings()" title="設定">⚙️</button>
    </div>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="empty">
      <div class="empty-icon">🎙</div>
      <div class="empty-text">按開始，自動連續識別<br>英文 / 普通話<br><br>粵語請按住 粵 鍵</div>
    </div>
    <!-- Interim display: live streaming text -->
    <div class="entry-interim" id="interim"></div>
  </div>

  <div class="live-bar">
    <div class="live-dot" id="live-dot"></div>
    <div class="live-text" id="live-text">準備就緒</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="clearAll()">
      <span class="ctrl-icon">🗑</span>
      <span class="ctrl-label">清除</span>
    </button>

    <div class="rec-wrap">
      <button class="rec-btn" id="rec-btn" onclick="toggleLive()">
        <span id="rec-icon">▶</span>
      </button>
      <div class="rec-label-text" id="rec-label">開始</div>
    </div>

    <!-- 粵語按住鍵 — 只有填了OAI key才顯示 -->
    <button class="yue-btn hidden" id="yue-btn"
      onmousedown="startYue()" onmouseup="stopYue()" onmouseleave="stopYue()"
      ontouchstart="startYue(event)" ontouchend="stopYue(event)">
      <span class="yue-icon">粵</span>
      <span class="yue-label">按住講</span>
    </button>

    <button class="ctrl-btn" onclick="copyAll()">
      <span class="ctrl-icon">📋</span>
      <span class="ctrl-label">複製</span>
    </button>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
  <button class="tooltip-close" onclick="closeTip()">✕</button>
  <div class="tooltip-term" id="tip-term"></div>
  <div class="tooltip-def"  id="tip-def"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';

// ── STATE ──
let oaiKey = '', antKey = '';
let termsOn = true;
let isLive = false;
let lastLangDir = '';
let fontSize = 17;

// Web Speech
let recognition = null;
let recognitionActive = false;
let debounceTimer = null;
let lastInterimText = '';

// Cantonese (Whisper)
let yueStream = null;
let yueRecorder = null;
let yueChunks = [];
let yuePressing = false;

// Translation queue
let transQueue = [];
let isTranslating = false;

// ── LEGAL TERMS ──
const TERMS = {
  'indictment':   { zh:'起訴書',   def:'正式刑事控罪文件，由檢察官提出，列明被告所面對的刑事罪行。' },
  'arraignment':  { zh:'提審',     def:'被告在法庭上首次聆聽控罪並作出答辯的程序。' },
  'bail':         { zh:'保釋',     def:'允許被告在審訊前以金錢擔保或條件獲釋，需在指定時間出庭。' },
  'plea':         { zh:'答辯',     def:'被告對控罪的正式回應：guilty（認罪）或 not guilty（不認罪）。' },
  'verdict':      { zh:'裁決',     def:'陪審團或法官對被告是否有罪的最終判定。' },
  'sentence':     { zh:'判決/刑罰', def:'法院對罪成被告所作的懲罰，包括監禁、罰款、緩刑等。' },
  'acquittal':    { zh:'無罪釋放', def:'法庭裁定被告無罪，正式解除所有刑事控罪。' },
  'subpoena':     { zh:'傳票',     def:'法院命令某人出庭作證或提交文件的法律命令。' },
  'affidavit':    { zh:'宣誓書',   def:'當事人在法律文件中以宣誓方式作出的書面陳述，具法律效力。' },
  'contempt':     { zh:'藐視法庭', def:'不服從法庭命令或干擾司法程序的行為，可判監禁或罰款。' },
  'defendant':    { zh:'被告',     def:'在刑事案件中被控告的一方。' },
  'plaintiff':    { zh:'原告',     def:'在民事訴訟中提出控告的一方。' },
  'prosecution':  { zh:'控方',     def:'代表政府提出刑事控罪的一方，由檢察官代表。' },
  'counsel':      { zh:'大律師',   def:'在法庭代表當事人的律師。' },
  'adjournment':  { zh:'押後',     def:'將法庭聆訊推遲至另一日期進行。' },
  'remand':       { zh:'還押',     def:'在審訊前將被告羈押候審，不獲保釋。' },
  'probation':    { zh:'緩刑',     def:'在監督下讓罪犯在社區服刑，而非入獄。' },
  'parole':       { zh:'假釋',     def:'在服滿部分刑期後提早釋放，仍受條件監督。' },
  'perjury':      { zh:'偽誓',     def:'在法庭宣誓後故意作出虛假陳述，屬刑事罪行。' },
  'hearsay':      { zh:'傳聞證據', def:'非親身目睹而轉述他人所說的陳述，一般不可作呈堂證供。' },
  'injunction':   { zh:'禁制令',   def:'法院命令某人做或不做某事，違者屬藐視法庭。' },
  'damages':      { zh:'賠償金',   def:'在民事訴訟中，法院判給勝訴方的金錢賠償。' },
  'mediation':    { zh:'調解',     def:'由中立第三方協助雙方在訴訟前達成和解。' },
  'affirmation':  { zh:'非宗教式宣誓', def:'不以宗教方式而以個人誠信保證所說為真的替代宣誓。' },
  'sworn':        { zh:'宣誓',     def:'在法庭上以宗教或非宗教方式保證所說為真。' },
  'magistrate':   { zh:'裁判官',   def:'在裁判法院審理輕微刑事案件的司法人員。' },
  'exhibit':      { zh:'呈堂證物', def:'在法庭作為證據呈上的物品或文件。' },
  'witness':      { zh:'證人',     def:'在法庭上作出親身陳述的人士。' },
  'cross-examination': { zh:'盤問', def:'由對方律師向證人提問，以質疑其證供可信性。' },
};

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  const ok = localStorage.getItem('lv_oai');
  const ak = localStorage.getItem('lv_ant');
  const fs = localStorage.getItem('lv_fontsize');
  if (ok) { document.getElementById('oai-key').value = ok; document.getElementById('oai-saved').style.display = 'block'; }
  if (ak) { document.getElementById('ant-key').value = ak; document.getElementById('ant-saved').style.display = 'block'; }
  if (fs) {
    fontSize = parseInt(fs);
    document.getElementById('font-slider').value = fontSize;
    document.getElementById('font-val').textContent = fontSize;
  }
  updateFontSize(fontSize);
});

function updateFontSize(val) {
  fontSize = parseInt(val);
  document.getElementById('font-val').textContent = val;
  document.documentElement.style.setProperty('--font-size', val + 'px');
  localStorage.setItem('lv_fontsize', val);
}

function toggleEye(id, btn) {
  const el = document.getElementById(id);
  if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁'; }
}

function startApp() {
  const ak = document.getElementById('ant-key').value.trim();
  const ok = document.getElementById('oai-key').value.trim();
  termsOn = document.getElementById('terms-on').checked;
  const saveKeys = document.getElementById('save-keys').checked;

  if (!ak || !ak.startsWith('sk-ant-')) { toast('請輸入正確的 Claude Key', 'err'); return; }

  antKey = ak;
  oaiKey = ok;

  if (saveKeys) {
    localStorage.setItem('lv_ant', ak);
    if (ok) localStorage.setItem('lv_oai', ok);
    else localStorage.removeItem('lv_oai');
  } else {
    localStorage.removeItem('lv_ant');
    localStorage.removeItem('lv_oai');
  }

  // 顯示粵語按鈕（如有OAI key）
  const yueBtn = document.getElementById('yue-btn');
  if (ok && ok.startsWith('sk-')) {
    yueBtn.classList.remove('hidden');
  } else {
    yueBtn.classList.add('hidden');
  }

  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').classList.add('active');
  syncHeaderBtns();
  toast('準備就緒！', 'ok');
}

function goSettings() {
  stopLive();
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
}

function syncHeaderBtns() {
  document.getElementById('terms-btn').className = 'hdr-btn' + (termsOn ? ' on' : '');
}

function toggleTerms() {
  termsOn = !termsOn;
  syncHeaderBtns();
  toast(termsOn ? '術語解釋：開' : '術語解釋：關');
}

// ── WEB SPEECH API ──
function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('此瀏覽器不支援語音識別，請用 Chrome', 'err'); return null; }

  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  // 同時監聽英文和普通話 — 用en-US作主要，中文作備
  // 注意：大部分瀏覽器只能設一個lang，用 cmn-Hans-CN 普通話
  // 但Chrome支援 'zh-CN' 和 'en-US' 混合，用 'zh-CN' 最穩定
  r.lang = 'zh-CN'; // Chrome會自動識別英文混入

  r.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }

    if (final.trim().length > 1) {
      // Final結果：清debounce，直接翻譯
      clearTimeout(debounceTimer);
      lastInterimText = '';
      document.getElementById('interim').textContent = '';
      enqueueTranslation(final.trim(), 'webspeech');
    } else if (interim.trim().length > 1) {
      // Interim：只顯示一個小點表示「正在聽」，debounce 600ms後送翻譯
      document.getElementById('interim').textContent = '…';
      lastInterimText = interim.trim();
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (lastInterimText.length > 1) {
          document.getElementById('interim').textContent = '';
          enqueueTranslation(lastInterimText, 'webspeech');
          lastInterimText = '';
        }
      }, 600);
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech') return; // 靜音，正常
    if (e.error === 'aborted') return;
    toast('識別錯誤：' + e.error, 'err');
    setLive('識別錯誤', '');
  };

  r.onend = () => {
    // 自動重啟保持連續
    if (isLive && !yuePressing) {
      try { r.start(); } catch(e) {}
    }
  };

  return r;
}

async function toggleLive() {
  if (isLive) stopLive();
  else await startLive();
}

async function startLive() {
  // 請求麥克風權限
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    toast('無法存取麥克風：' + e.message, 'err'); return;
  }

  recognition = buildRecognition();
  if (!recognition) return;

  isLive = true;
  try { recognition.start(); } catch(e) {}

  document.getElementById('rec-btn').classList.add('live');
  document.getElementById('rec-icon').textContent = '⏹';
  document.getElementById('rec-label').textContent = '停止';
  setLive('監聽中…', 'rec');
  hideEmpty();
}

function stopLive() {
  isLive = false;
  clearTimeout(debounceTimer);
  lastInterimText = '';
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  document.getElementById('rec-btn').classList.remove('live');
  document.getElementById('rec-icon').textContent = '▶';
  document.getElementById('rec-label').textContent = '開始';
  document.getElementById('interim').textContent = '';
  setLive('已停止', '');
}

// ── CANTONESE (WHISPER) ──
async function startYue(e) {
  if (e) e.preventDefault();
  if (yuePressing) return;
  yuePressing = true;
  document.getElementById('yue-btn').classList.add('pressing');

  // 暫停Web Speech避免干擾
  if (recognition) { try { recognition.stop(); } catch(e2) {} }

  try {
    yueStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    toast('麥克風錯誤', 'err'); yuePressing = false; return;
  }

  yueChunks = [];
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : 'audio/webm';
  yueRecorder = new MediaRecorder(yueStream, { mimeType });
  yueRecorder.ondataavailable = e2 => { if (e2.data.size > 0) yueChunks.push(e2.data); };
  yueRecorder.start(100);
  setLive('粵語錄音中… 放開即識別', 'rec');
}

async function stopYue(e) {
  if (e) e.preventDefault();
  if (!yuePressing) return;
  yuePressing = false;
  document.getElementById('yue-btn').classList.remove('pressing');

  if (yueRecorder && yueRecorder.state !== 'inactive') {
    yueRecorder.onstop = async () => {
      const mimeType = yueRecorder.mimeType;
      if (yueStream) { yueStream.getTracks().forEach(t => t.stop()); yueStream = null; }
      const blob = new Blob(yueChunks, { type: mimeType });
      if (blob.size > 1000) {
        setLive('識別粵語中…', 'proc');
        try {
          const text = await whisper(blob, mimeType);
          if (text && text.trim().length > 1) {
            enqueueTranslation(text.trim(), 'yue');
          }
        } catch(err) {
          toast('粵語識別失敗：' + err.message, 'err');
        }
      }
      // 恢復Web Speech
      if (isLive && recognition) {
        try { recognition.start(); } catch(e2) {}
        setLive('監聽中…', 'rec');
      }
    };
    yueRecorder.stop();
  } else {
    if (yueStream) { yueStream.getTracks().forEach(t => t.stop()); yueStream = null; }
    if (isLive && recognition) {
      try { recognition.start(); } catch(e2) {}
      setLive('監聽中…', 'rec');
    }
  }
}

// ── TRANSLATION QUEUE ──
function enqueueTranslation(text, source) {
  transQueue.push({ text, source });
  if (!isTranslating) drainTransQueue();
}

async function drainTransQueue() {
  if (transQueue.length === 0) { isTranslating = false; return; }
  isTranslating = true;
  const { text, source } = transQueue.shift();
  await processText(text, source);
  drainTransQueue();
}

async function processText(text, source) {
  const proc = addProc();
  setLive('翻譯中…', 'proc');
  try {
    const result = await translate(text, source);
    proc.remove();
    addEntry(result);
    if (isLive) setLive('監聽中…', 'rec');
    else setLive('完成', '');
  } catch (err) {
    proc.remove();
    toast(err.message, 'err');
    if (isLive) setLive('監聽中…', 'rec');
  }
}

// ── WHISPER ──
async function whisper(blob, mimeType) {
  const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
  const fd = new FormData();
  fd.append('file', new File([blob], `audio.${ext}`, { type: mimeType }));
  fd.append('model', 'whisper-1');
  fd.append('language', 'zh'); // zh自動識別粵語/普通話

  const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${oaiKey}` },
    body: fd
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e?.error?.message || `Whisper ${r.status}`);
  }
  const d = await r.json();
  return d.text || '';
}

// ── CLAUDE TRANSLATE ──
async function translate(text, source) {
  const isYue = source === 'yue';
  // 偵測語言：粵語直接標記；其他用Claude判斷
  const systemPrompt = `You are a professional legal interpreter specialising in Queensland law.
Detect the language of the input and translate it:
- English → Traditional Chinese (繁體中文)
- Mandarin/Cantonese → English

Return ONLY valid JSON, no markdown, no explanation:
{
  "original": "<original text>",
  "translation": "<translated text>",
  "detected_lang": "en" | "zh" | "yue",
  "lang_label": "English" | "普通話" | "粵語",
  "terms": [{"term":"<english term>","zh":"<chinese>","explanation":"<definition in Chinese>"}]
}

Rules:
- Preserve legal terminology accuracy
- terms array: only include Queensland legal terms found in the text, max 3
- If input is already translated or too short, still return valid JSON`;

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': antKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 400,
      system: isYue
        ? systemPrompt.replace('Detect the language', 'The input is Cantonese (粵語). Translate it')
        : systemPrompt,
      messages: [{ role: 'user', content: text }]
    })
  });

  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e?.error?.message || `Claude ${r.status}`);
  }
  const d = await r.json();
  const raw = d.content?.[0]?.text || '';
  try {
    const clean = raw.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  } catch {
    // fallback
    return { original: text, translation: raw, detected_lang: isYue ? 'yue' : 'zh', lang_label: isYue ? '粵語' : '中文', terms: [] };
  }
}

// ── UI: ADD ENTRY ──
function addEntry(r) {
  const feed = document.getElementById('feed');
  const langDir = r.detected_lang === 'en' ? 'en→zh' : 'zh→en';

  // 換方向加分隔線
  if (lastLangDir !== langDir) {
    const div = document.createElement('div');
    div.className = 'lang-divider';
    const label = langDir === 'en→zh' ? 'English → 中文' : (r.detected_lang === 'yue' ? '粵語 → English' : '中文 → English');
    div.innerHTML = `<div class="lang-divider-line"></div><div class="lang-divider-label">${label}</div><div class="lang-divider-line"></div>`;
    feed.insertBefore(div, document.getElementById('interim'));
  }
  lastLangDir = langDir;

  let transHtml = escHtml(r.translation || '');
  let origHtml  = escHtml(r.original || '');

  if (termsOn) {
    const allTerms = [...(r.terms || [])];
    if (r.original) {
      const words = r.original.toLowerCase().split(/\W+/);
      words.forEach(w => {
        if (TERMS[w] && !allTerms.find(t => t.term.toLowerCase() === w)) {
          allTerms.push({ term: w, zh: TERMS[w].zh, explanation: TERMS[w].def });
        }
      });
    }
    allTerms.forEach(t => {
      if (!t.term) return;
      const safeZh  = escAttr(t.zh || '');
      const safeDef = escAttr(t.explanation || '');
      const re = new RegExp(`\\b(${t.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`, 'gi');
      origHtml = origHtml.replace(re, `<span class="term-hl" onclick="showTip('$1','${safeZh}','${safeDef}')">$1</span>`);
    });
  }

  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<div class="entry-orig">${origHtml}</div><div class="entry-trans">${transHtml}</div>`;
  feed.insertBefore(entry, document.getElementById('interim'));
  feed.scrollTop = feed.scrollHeight;
}

function addProc() {
  const feed = document.getElementById('feed');
  const d = document.createElement('div');
  d.className = 'proc-entry';
  d.innerHTML = `<div class="spinner"></div><div class="proc-text">翻譯中…</div>`;
  feed.insertBefore(d, document.getElementById('interim'));
  feed.scrollTop = feed.scrollHeight;
  return d;
}

function hideEmpty() {
  const e = document.getElementById('empty');
  if (e) e.style.display = 'none';
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s) {
  return String(s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setLive(txt, dotMode) {
  document.getElementById('live-text').textContent = txt;
  const d = document.getElementById('live-dot');
  d.className = 'live-dot' + (dotMode ? ' ' + dotMode : '');
}

function showTip(term, zh, def) {
  document.getElementById('tip-term').textContent = `${term}　${zh}`;
  document.getElementById('tip-def').textContent = def || '';
  document.getElementById('tooltip').classList.add('show');
}
function closeTip() { document.getElementById('tooltip').classList.remove('show'); }

function clearAll() {
  stopLive();
  const feed = document.getElementById('feed');
  // 清除所有entry和divider，保留empty和interim
  feed.querySelectorAll('.entry, .lang-divider, .proc-entry').forEach(e => e.remove());
  document.getElementById('empty').style.display = '';
  document.getElementById('interim').textContent = '';
  lastLangDir = '';
  transQueue = [];
  setLive('準備就緒', '');
}

function copyAll() {
  const entries = document.querySelectorAll('.entry');
  if (entries.length === 0) { toast('還沒有翻譯', 'err'); return; }
  const lines = [];
  entries.forEach(entry => {
    const orig  = entry.querySelector('.entry-orig')?.textContent?.trim();
    const trans = entry.querySelector('.entry-trans')?.textContent?.trim();
    if (orig)  lines.push(orig);
    if (trans) lines.push(trans);
    lines.push('');
  });
  const text = lines.join('\n').trim();
  navigator.clipboard.writeText(text)
    .then(() => toast(`已複製 ${entries.length} 段 ✓`, 'ok'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      toast(`已複製 ${entries.length} 段 ✓`, 'ok');
    });
}

// Toast
let _tt;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2800);
}

document.addEventListener('click', e => {
  const tip = document.getElementById('tooltip');
  if (tip.classList.contains('show') && !tip.contains(e.target) && !e.target.classList.contains('term-hl')) closeTip();
});
